name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: /tmp/firkin-target

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt

      - name: Install native test tools
        run: |
          brew install protobuf e2fsprogs
          echo "/opt/homebrew/opt/e2fsprogs/sbin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/e2fsprogs/sbin" >> "$GITHUB_PATH"

      - name: Cargo metadata
        run: cargo metadata --format-version 1

      - name: Format
        run: cargo fmt --check

      - name: Crate graph
        run: scripts/check-firkin-crate-graph.sh

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Facade examples
        run: cargo check -p firkin --examples
