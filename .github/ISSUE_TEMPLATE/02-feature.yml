name: Feature request
description: Request a Firkin library capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Describe the caller-visible API or behavior you need.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Note macOS, Apple/VZ, E2B compatibility, or publishing constraints.
