name: Bug report
description: Report incorrect Firkin behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, feature flags, and whether the run used live Apple/VZ.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - macOS:
        - Apple silicon model:
        - Rust:
        - Xcode command line tools:
        - vminitd source: runtime-download / env override / vendored
      render: markdown
    validations:
      required: true
