[package]
name = "firkin-runtime"
description = "Production Apple/VZ runtime composition for the firkin Rust containerization library"
version = "0.0.1-alpha"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "firkin_runtime"
path = "src/lib.rs"

[features]
default = []
snapshot = ["firkin-core/snapshot"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
firkin-core = { path = "../core", version = "0.0.1-alpha" }
firkin-ext4 = { path = "../ext4", version = "0.0.1-alpha" }
firkin-oci = { path = "../oci", version = "0.0.1-alpha" }
firkin-template = { path = "../template", version = "0.0.1-alpha" }
firkin-trace = { path = "../trace", version = "0.0.1-alpha" }
firkin-types = { path = "../types", version = "0.0.1-alpha" }
firkin-vminitd-bytes = { path = "../vminitd-bytes", version = "0.0.1-alpha" }
firkin-vmm = { path = "../vmm", version = "0.0.1-alpha" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
uuid.workspace = true
firkin-admission = { path = "../admission", version = "0.0.1-alpha" }
firkin-artifacts = { path = "../artifacts", version = "0.0.1-alpha" }
firkin-hygiene = { path = "../hygiene", version = "0.0.1-alpha" }
firkin-e2b-contract = { path = "../e2b-contract", version = "0.0.1-alpha" }
firkin-e2b-server = { path = "../e2b-server", version = "0.0.1-alpha" }
firkin-e2b-wire = { path = "../e2b-wire", version = "0.0.1-alpha" }
firkin-envd = { path = "../envd", version = "0.0.1-alpha" }

[dev-dependencies]
firkin-benchmark = { path = "../benchmark", version = "0.0.1-alpha" }
firkin-evidence = { path = "../evidence", version = "0.0.1-alpha" }
futures-util.workspace = true
prost.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt"] }
firkin-single-node = { path = "../single-node", version = "0.0.1-alpha" }

[lints]
workspace = true
