[package]
name = "firkin-e2b-wire"
description = "Wire protocol shapes for E2B-compatible firkin sandbox APIs"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "firkin_e2b_wire"
path = "src/lib.rs"

[dependencies]
bytes.workspace = true
firkin-types = { path = "../types", version = "0.0.2", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
time = { workspace = true, features = ["formatting"] }
