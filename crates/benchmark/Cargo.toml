[package]
name = "firkin-benchmark"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "firkin_benchmark"
path = "src/lib.rs"

[dependencies]
firkin-template = { path = "../template", version = "0.1.0" }
firkin-trace = { path = "../trace", version = "0.1.0" }
firkin-types = { path = "../types", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
uuid.workspace = true
firkin-evidence = { path = "../evidence", version = "0.1.0" }
firkin-e2b-contract = { path = "../e2b-contract", version = "0.1.0" }
firkin-e2b-server = { path = "../e2b-server", version = "0.1.0" }
firkin-e2b-wire = { path = "../e2b-wire", version = "0.1.0" }
firkin-envd = { path = "../envd", version = "0.1.0" }

[dev-dependencies]
tempfile.workspace = true
