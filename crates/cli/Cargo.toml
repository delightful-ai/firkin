[package]
name = "firkin-cli"
description = "Development CLI for exercising the firkin Rust containerization library"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fk"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
firkin = { path = "../firkin", version = "0.0.1" }
firkin-runtime = { path = "../runtime", version = "0.0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
