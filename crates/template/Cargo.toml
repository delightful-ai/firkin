[package]
name = "firkin-template"
description = "Template build execution for the firkin Rust containerization library"
version = "0.0.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "firkin_template"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
firkin-trace = { path = "../trace", version = "0.0.3" }
thiserror.workspace = true
firkin-artifacts = { path = "../artifacts", version = "0.0.3" }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
